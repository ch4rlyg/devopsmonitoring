# Docs: https://github.com/Azure/login | https://learn.microsoft.com/azure/container-registry/

name: Build and push image to ACR - webapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT (OIDC)
      contents: read #This is required for actions/checkout
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: npm install and test
        run: |
          npm ci
          npm run test --if-present

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/webapp:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/webapp:latest \
            .

      - name: Push image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/webapp:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/webapp:latest
